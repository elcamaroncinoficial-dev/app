<style>
  :root{
    --azul-osc:#0E1D46;
    --azul-med:#1E3A82;
    --azul-claro:#3A5BAE;
    --dorado:#E3B155;
    --naranja:#F07C1D;
    --crema:#FBF6EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));
    background:
      linear-gradient(180deg, rgba(10,8,6,.35) 0%, rgba(8,6,5,.55) 55%, rgba(5,4,3,.88) 100%),
      url('fondo_mariscos.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
    color:var(--crema);
  }
  .contenido{position:relative; z-index:1; max-width:420px; width:100%; display:flex; flex-direction:column; align-items:center;}

  img.logo{
    width:min(58vw,240px);
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));
    margin-bottom:48px;
  }

  .botones{width:100%; display:flex; flex-direction:column; gap:16px;}

  .btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:19px 20px;
    border-radius:20px;
    text-decoration:none;
    text-align:left;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-icono{
    width:50px;height:50px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn-icono svg{width:26px;height:26px;}
  .btn-texto{flex:1; min-width:0;}
  .btn-titulo{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.25;
    display:block;
  }
  .btn-sub{
    display:block;
    font-size:12px;
    opacity:.85;
    margin-top:3px;
    line-height:1.4;
  }
  .btn-flecha{font-size:20px; opacity:.6; flex-shrink:0;}

  .btn-principal{
    background:linear-gradient(135deg, #FF9843 0%, var(--naranja) 60%, #D96812 100%);
    color:#fff;
    box-shadow:0 14px 30px rgba(240,124,29,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-principal .btn-icono{background:rgba(255,255,255,.24);}

  .btn-secundario{
    background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.26);
    color:var(--crema);
    backdrop-filter:blur(8px);
  }
  .btn-secundario .btn-icono{background:rgba(227,177,85,.18); color:var(--dorado);}

  .acciones{width:100%; display:flex; gap:10px; margin-top:16px;}
  .accion{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:14px 6px;
    border-radius:16px;
    background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.22);
    color:var(--crema);
    text-decoration:none;
    backdrop-filter:blur(8px);
    transition:transform .15s ease;
  }
  .accion:active{transform:scale(.96);}
  .accion-icono{
    width:38px;height:38px;
    border-radius:12px;
    background:rgba(227,177,85,.18);
    display:flex;align-items:center;justify-content:center;
    color:var(--dorado);
    flex-shrink:0;
  }
  .accion-icono svg{width:19px;height:19px;}
  .accion-label{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11.5px; line-height:1.2;}

  .redes{display:flex; gap:14px; margin-top:30px;}
  .red-icono{
    width:44px;height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    border:1.5px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    color:var(--crema);
    text-decoration:none;
  }
  .red-icono svg{width:19px;height:19px;}

  .social-label{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.03em;
    color:rgba(251,246,236,.65);
    margin-top:32px;
  }

  .compartir{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:16px;
    padding:12px 22px;
    border-radius:100px;
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.24);
    color:var(--crema);
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .compartir:active{transform:scale(.96);}
  .compartir svg{width:17px;height:17px;flex-shrink:0;}

  .toast{
    position:fixed;
    left:50%; bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--dorado);
    color:#241705;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 20px;
    border-radius:100px;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:99;
  }
  .toast.mostrar{opacity:1; transform:translateX(-50%) translateY(0);}

  .pie{
    margin-top:28px;
    font-size:11.5px;
    color:rgba(251,246,236,.55);
    line-height:1.7;
  }

  @media (min-width:700px){
    body{
      justify-content:center;
      padding:48px 24px;
    }
    .contenido{max-width:480px;}
    img.logo{width:min(40vw,280px); margin-bottom:56px;}
    .btn{padding:22px 24px;}
    .acciones{margin-top:20px;}
    .redes{margin-top:36px;}
    .pie{margin-top:32px; font-size:12.5px;}
  }
</style>
</head>
<body>

<div class="contenido">

  <div class="botones">

    <a href="/menu-digital/menu.html" class="btn btn-secundario">
      <span class="btn-icono">
        <svg viewBox="0 0 24 24" style="width:26px;height:26px;">
          <path d="M12 5.5c-1.8-1.2-4-1.7-6.3-1.3-.4.1-.7.4-.7.9v12.3c0 .5.4.9.9.8 2-.3 4 .1 5.6 1.1.3.2.7.2 1 0 1.6-1 3.6-1.4 5.6-1.1.5.1.9-.3.9-.8V5.1c0-.5-.3-.8-.7-.9-2.3-.4-4.5.1-6.3 1.3z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>

  <div class="acciones">

      <span class="accion-icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.1 7-12a7 7 0 0 0-14 0c0 4.9 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>

  <p class="social-label">Síguenos en redes sociales</p>
  <div class="redes">

<div class="toast" id="toast">Link copiado</div>

<script>
function compartirPagina(){
  const datos = {
    title: 'El Camaroncín ¡Uh Ah Ah! Marisquería',
    text: 'Pide a domicilio o consulta el menú de El Camaroncín 🦐',
    url: window.location.href
  };
  if (navigator.share) {
    navigator.share(datos).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(datos.url).then(mostrarToast);
  }
}
function mostrarToast(){
  const t = document.getElementById('toast');
  t.classList.add('mostrar');
  setTimeout(()=>t.classList.remove('mostrar'), 2200);
}
</script>

</body>
