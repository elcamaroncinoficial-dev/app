<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>El Camaroncín ¡Uh Ah Ah! Marisquería</title>
<meta name="description" content="El Camaroncín — haz tu pedido a domicilio o consulta nuestro menú digital." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://camaroncin-marisqueria.netlify.app/bienvenida/" />
<meta property="og:title" content="El Camaroncín ¡Uh Ah Ah! Marisquería" />
<meta property="og:description" content="Haz tu pedido a domicilio o consulta nuestro menú digital." />
<meta property="og:image" content="https://camaroncin-marisqueria.netlify.app/bienvenida/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-osc:#0E1D46;
    --azul-med:#1E3A82;
    --azul-claro:#3A5BAE;
    --dorado:#E3B155;
    --naranja:#F07C1D;
    --crema:#FBF6EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));
    background:
      linear-gradient(180deg, rgba(10,8,6,.35) 0%, rgba(8,6,5,.55) 55%, rgba(5,4,3,.88) 100%),
      url('fondo_mariscos.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
    color:var(--crema);
  }
  .contenido{position:relative; z-index:1; max-width:420px; width:100%; display:flex; flex-direction:column; align-items:center;}

  img.logo{
    width:min(58vw,240px);
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));
    margin-bottom:48px;
  }

  .botones{width:100%; display:flex; flex-direction:column; gap:16px;}

  .btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:19px 20px;
    border-radius:20px;
    text-decoration:none;
    text-align:left;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-icono{
    width:50px;height:50px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn-icono svg{width:26px;height:26px;}
  .btn-texto{flex:1; min-width:0;}
  .btn-titulo{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.25;
    display:block;
  }
  .btn-sub{
    display:block;
    font-size:12px;
    opacity:.85;
    margin-top:3px;
    line-height:1.4;
  }
  .btn-flecha{font-size:20px; opacity:.6; flex-shrink:0;}

  .btn-principal{
    background:linear-gradient(135deg, #FF9843 0%, var(--naranja) 60%, #D96812 100%);
    color:#fff;
    box-shadow:0 14px 30px rgba(240,124,29,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-principal .btn-icono{background:rgba(255,255,255,.24);}

  .btn-secundario{
    background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.26);
    color:var(--crema);
    backdrop-filter:blur(8px);
  }
  .btn-secundario .btn-icono{background:rgba(227,177,85,.18); color:var(--dorado);}

  .pie{
    margin-top:46px;
    font-size:11.5px;
    color:rgba(251,246,236,.55);
    line-height:1.7;
  }

  @media (min-width:700px){
    body{
      justify-content:center;
      padding:48px 24px;
    }
    .contenido{max-width:480px;}
    img.logo{width:min(40vw,280px); margin-bottom:56px;}
    .btn{padding:22px 24px;}
    .pie{margin-top:56px; font-size:12.5px;}
  }
</style>
</head>
<body>

<div class="contenido">
  <img class="logo" src="logo_trans.png" alt="El Camaroncín ¡Uh Ah Ah! Marisquería" />

  <div class="botones">
    <a href="/" class="btn btn-principal">
      <span class="btn-icono">
        <svg viewBox="0 0 24 24" style="width:26px;height:26px;">
          <path d="M3 4h2l.35 2M6.35 6h13.4l-1.8 7.2a1.5 1.5 0 0 1-1.46 1.13H8.2a1.5 1.5 0 0 1-1.46-1.14L4.9 4.45" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9.5" cy="19.5" r="1.3" fill="currentColor"/>
          <circle cx="16.5" cy="19.5" r="1.3" fill="currentColor"/>
        </svg>
      </span>
      <span class="btn-texto">
        <span class="btn-titulo">Hacer un pedido</span>
        <span class="btn-sub">Descarga la app a tu celular</span>
      </span>
      <span class="btn-flecha">›</span>
    </a>

    <a href="/menu-digital/menu.html" class="btn btn-secundario">
      <span class="btn-icono">
        <svg viewBox="0 0 24 24" style="width:26px;height:26px;">
          <path d="M12 5.5c-1.8-1.2-4-1.7-6.3-1.3-.4.1-.7.4-.7.9v12.3c0 .5.4.9.9.8 2-.3 4 .1 5.6 1.1.3.2.7.2 1 0 1.6-1 3.6-1.4 5.6-1.1.5.1.9-.3.9-.8V5.1c0-.5-.3-.8-.7-.9-2.3-.4-4.5.1-6.3 1.3z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          <path d="M12 5.5v13.4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7.3 8.2c1.3.1 2.6.5 3.6 1.1M7.3 11c1.3.1 2.6.5 3.6 1.1M7.3 13.8c1.3.1 2.3.4 3.2.9" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".8"/>
        </svg>
      </span>
      <span class="btn-texto">
        <span class="btn-titulo">Ver el menú</span>
        <span class="btn-sub">Platillos, precios y descarga en PDF</span>
      </span>
      <span class="btn-flecha">›</span>
    </a>
  </div>

  <p class="pie">Amado Nervo #58, Los Reyes, Tultitlán<br>Miércoles a sábado 12–19 hrs · Domingo y lunes 12–18 hrs</p>
</div>

</body>
</html>
