<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>El Camaroncín ¡Uh Ah Ah! Marisquería</title>
<meta name="description" content="El Camaroncín — haz tu pedido a domicilio o consulta nuestro menú digital." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-osc:#0E1D46;
    --azul-med:#1E3A82;
    --azul-claro:#3A5BAE;
    --dorado:#E3B155;
    --naranja:#F07C1D;
    --crema:#FBF6EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));
    background:
      linear-gradient(180deg, rgba(10,8,6,.35) 0%, rgba(8,6,5,.55) 55%, rgba(5,4,3,.88) 100%),
      url('fondo_mariscos.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
    overflow:hidden;
    color:var(--crema);
  }
  .contenido{position:relative; z-index:1; max-width:420px; width:100%; display:flex; flex-direction:column; align-items:center;}

  img.logo{
    width:min(58vw,240px);
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));
    margin-bottom:48px;
  }

  .botones{width:100%; display:flex; flex-direction:column; gap:16px;}

  .btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:19px 20px;
    border-radius:20px;
    text-decoration:none;
    text-align:left;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-icono{
    width:50px;height:50px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn-icono svg{width:26px;height:26px;}
  .btn-texto{flex:1; min-width:0;}
  .btn-titulo{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.25;
    display:block;
  }
  .btn-sub{
    display:block;
    font-size:12px;
    opacity:.85;
    margin-top:3px;
    line-height:1.4;
  }
  .btn-flecha{font-size:20px; opacity:.6; flex-shrink:0;}

  .btn-principal{
    background:linear-gradient(135deg, #FF9843 0%, var(--naranja) 60%, #D96812 100%);
    color:#fff;
    box-shadow:0 14px 30px rgba(240,124,29,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-principal .btn-icono{background:rgba(255,255,255,.24);}

  .btn-secundario{
    background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.26);
    color:var(--crema);
    backdrop-filter:blur(8px);
  }
  .btn-secundario .btn-icono{background:rgba(227,177,85,.18); color:var(--dorado);}

  .pie{
    margin-top:46px;
    font-size:11.5px;
    color:rgba(251,246,236,.55);
    line-height:1.7;
  }
</style>
</head>
