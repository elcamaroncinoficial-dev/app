<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0E1D46;}
  img{display:block;width:100%;height:auto;}
  .barra-flotante{
    position:sticky;top:0;z-index:40;
    display:flex;gap:12px;justify-content:center;
    padding:12px 14px;
    background:rgba(14,29,70,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 18px rgba(0,0,0,.25);
    font-family:'Baloo 2',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .barra-flotante a{
    font-weight:700;
    font-size:13.5px;
    white-space:nowrap;
    text-decoration:none;
    display:flex;align-items:center;gap:7px;
    padding:10px 18px;
    border-radius:100px;
    transition:transform .15s ease;
  }
  .barra-flotante a:active{transform:scale(.96);}
  .barra-flotante a svg{width:16px;height:16px;flex-shrink:0;}

  .barra-flotante a.secundario{
    color:#FBF6EC;
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.22);
  }
  .barra-flotante a.principal{
    color:#fff;
    background:linear-gradient(135deg, #FF9843 0%, #F07C1D 60%, #D96812 100%);
    box-shadow:0 6px 16px rgba(240,124,29,.4), inset 0 1px 0 rgba(255,255,255,.3);
  }

  .paginas{max-width:100%;margin:0 auto;}

  .galeria-header{padding:48px 20px 8px;text-align:center;font-family:'Baloo 2',sans-serif;}
  .galeria-header h2{color:#fff;font-size:23px;font-weight:700;letter-spacing:.01em;}
  .galeria-header p{color:rgba(255,255,255,.5);font-size:12px;margin-top:7px;letter-spacing:.02em;}

  .galeria{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px 14px;
    padding:24px 16px 56px;
    max-width:100%;
    margin:0 auto;
  }
  .galeria-item{
    cursor:pointer;
    opacity:0;
    transform:translateY(18px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .galeria-item.visible{opacity:1;transform:translateY(0);}
  .galeria-item figure{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:4/5;
    background:linear-gradient(100deg, #142149 8%, #223468 18%, #142149 33%);
    background-size:300% 100%;
    animation:brillo 1.8s ease-in-out infinite;
    box-shadow:0 10px 26px rgba(0,0,0,.3);
    border:1px solid rgba(227,177,85,0);
    transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease, border-color .35s ease;
  }
  @keyframes brillo{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  .galeria-item figure.lista{animation:none;}
  .galeria-item:active figure{transform:scale(.96);}
  @media (hover:hover){
    .galeria-item:hover figure{border-color:rgba(227,177,85,.55); box-shadow:0 14px 34px rgba(0,0,0,.4);}
  }
  .galeria-item figure::after{
    content:'';
    position:absolute;inset:0;
    background:radial-gradient(120% 100% at 50% 0%, rgba(20,15,8,0) 55%, rgba(20,12,5,.28) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .galeria-item img{
    position:relative;z-index:0;
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;
    transition:opacity .5s ease, transform .6s ease;
    transform:scale(1.04);
  }
  .galeria-item img.cargada{opacity:1;transform:scale(1);}
  .galeria-item figcaption{
    margin-top:10px;
    text-align:center;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:500;
    font-size:13px;
    letter-spacing:.015em;
    text-transform:none;
    color:rgba(251,246,236,.78);
    line-height:1.3;
  }

  #lightbox{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:center;justify-content:center;
    padding:28px 20px;
    background:rgba(6,10,26,0);
    backdrop-filter:blur(0px);
    -webkit-backdrop-filter:blur(0px);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease, background .35s ease, backdrop-filter .35s ease;
  }
  #lightbox.abierto{
    opacity:1;pointer-events:auto;
    background:rgba(6,10,26,.92);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  #lightbox figure{
    max-width:min(92vw,520px);
    max-height:82vh;
    margin:0;
    transform:scale(.92);
    transition:transform .35s cubic-bezier(.2,.7,.2,1);
  }
  #lightbox.abierto figure{transform:scale(1);}
  #lightbox img{
    width:100%;height:100%;max-height:74vh;
    object-fit:contain;
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #lightbox figcaption{
    margin-top:18px;text-align:center;
    font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
    font-size:17px;color:#fff;letter-spacing:.01em;
  }
  #lightbox .cerrar{
    position:absolute;top:20px;right:20px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.1);
    border:1.5px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  #lightbox .flecha{
    position:absolute;top:50%;
    transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.1);
    border:1.5px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    transition:background .2s ease, transform .15s ease;
  }
  #lightbox .flecha:active{transform:translateY(-50%) scale(.9);}
  #lightbox .flecha:hover{background:rgba(255,255,255,.2);}
  #lightbox .anterior{left:10px;}
  #lightbox .siguiente{right:10px;}
  @media (min-width:640px){
    #lightbox .anterior{left:24px;}
    #lightbox .siguiente{right:24px;}
  }

  @media (min-width:700px){
    .galeria{max-width:820px;grid-template-columns:repeat(3,1fr);gap:34px 24px;}
    .galeria-item figcaption{font-size:11.5px;}
  }

  @media (min-width:700px){
    body{background:#050B18;}
    .paginas{
      max-width:640px;
      box-shadow:0 24px 70px rgba(0,0,0,.55);
    }
  }
</style>

<div id="lightbox" onclick="if(event.target===this)cerrarLightbox()">
  <button class="cerrar" onclick="cerrarLightbox()" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="flecha anterior" onclick="event.stopPropagation();fotoAnterior()" aria-label="Anterior">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button class="flecha siguiente" onclick="event.stopPropagation();fotoSiguiente()" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <figure>
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
</div>

<script>
const galeriaImgs = Array.from(document.querySelectorAll('.galeria-item img'));
let indiceActual = 0;

function abrirLightbox(imgEl){
  indiceActual = galeriaImgs.indexOf(imgEl);
  mostrarFoto(indiceActual);
  document.getElementById('lightbox').classList.add('abierto');
  document.body.style.overflow = 'hidden';
}
function mostrarFoto(i){
  const total = galeriaImgs.length;
  indiceActual = (i + total) % total;
  const img = galeriaImgs[indiceActual];
  const nombre = img.closest('.galeria-item').querySelector('figcaption').textContent;
  document.getElementById('lightbox-img').src = img.src;
  document.getElementById('lightbox-caption').textContent = nombre;
}
function fotoAnterior(){ mostrarFoto(indiceActual - 1); }
function fotoSiguiente(){ mostrarFoto(indiceActual + 1); }
function cerrarLightbox(){
  document.getElementById('lightbox').classList.remove('abierto');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('abierto')) return;
  if (e.key === 'Escape') cerrarLightbox();
  if (e.key === 'ArrowLeft') fotoAnterior();
  if (e.key === 'ArrowRight') fotoSiguiente();
});

let toqueInicioX = null;
const lightboxEl = document.getElementById('lightbox');
lightboxEl.addEventListener('touchstart', e => { toqueInicioX = e.touches[0].clientX; });
lightboxEl.addEventListener('touchend', e => {
  if (toqueInicioX === null) return;
  const dx = e.changedTouches[0].clientX - toqueInicioX;
  if (Math.abs(dx) > 45) { dx > 0 ? fotoAnterior() : fotoSiguiente(); }
  toqueInicioX = null;
});

const observador = new IntersectionObserver((entradas) => {
  entradas.forEach(entrada => {
    if (entrada.isIntersecting) {
      entrada.target.classList.add('visible');
      observador.unobserve(entrada.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });

document.querySelectorAll('.galeria-item').forEach(el => observador.observe(el));
</script>
