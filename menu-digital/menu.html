<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0E1D46;}
  img{display:block;width:100%;height:auto;}
  .barra-flotante{
    position:sticky;top:0;z-index:40;
    display:flex;gap:12px;justify-content:center;
    padding:12px 14px;
    background:rgba(14,29,70,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 18px rgba(0,0,0,.25);
    font-family:'Baloo 2',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .barra-flotante a{
    font-weight:700;
    font-size:13.5px;
    white-space:nowrap;
    text-decoration:none;
    display:flex;align-items:center;gap:7px;
    padding:10px 18px;
    border-radius:100px;
    transition:transform .15s ease;
  }
  .barra-flotante a:active{transform:scale(.96);}
  .barra-flotante a svg{width:16px;height:16px;flex-shrink:0;}

  .barra-flotante a.secundario{
    color:#FBF6EC;
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border:1.5px solid rgba(255,255,255,.22);
  }
  .barra-flotante a.principal{
    color:#fff;
    background:linear-gradient(135deg, #FF9843 0%, #F07C1D 60%, #D96812 100%);
    box-shadow:0 6px 16px rgba(240,124,29,.4), inset 0 1px 0 rgba(255,255,255,.3);
  }
</style>
</head>
<body>

<div class="barra-flotante">

    Descargar PDF
  </a>
  <a href="/" class="principal">
    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l.35 2M6.35 6h13.4l-1.8 7.2a1.5 1.5 0 0 1-1.46 1.13H8.2a1.5 1.5 0 0 1-1.46-1.14L4.9 4.45"/><circle cx="9.5" cy="19.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16.5" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg>

</div>
